name: render-notebook-once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/render-notebook-once.yml"

permissions:
  contents: write

jobs:
  render-notebook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: module://matplotlib_inline.backend_inline
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert

      - name: Execute notebook in place
        run: |
          jupyter nbconvert --to notebook --execute --inplace notebooks/01_exploratory_analysis.ipynb --ExecutePreprocessor.timeout=300

      - name: Commit rendered notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/01_exploratory_analysis.ipynb
          if git diff --cached --quiet; then
            echo "Notebook output unchanged."
          else
            git commit -m "Render exploratory notebook outputs"
            git push origin HEAD:main
          fi
